name: Release

# Publishes @jubasjl76-eng/shared to GitHub Packages when the version in
# package.json changes on main. A `shared-v<version>` tag records what shipped
# and is what consumers pin to (git-tag dependency).

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "src/**"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@jubasjl76-eng"
          cache: npm

      - name: Resolve version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Already published?
        id: check
        run: |
          if git rev-parse "shared-v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "shared-v${{ steps.v.outputs.version }} already tagged; nothing to do."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.check.outputs.publish == 'true'
        run: npm ci

      - name: Test
        if: steps.check.outputs.publish == 'true'
        run: npm test

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the release
        if: steps.check.outputs.publish == 'true'
        run: |
          git tag "shared-v${{ steps.v.outputs.version }}"
          git push origin "shared-v${{ steps.v.outputs.version }}"
